name: Weekly Collection Placeholder
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collect
